<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JRA ダート高期待値AI予測</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg tracking-wide">&#127943; JRA Dirt AI Predictor</h1>
      <span class="text-xs bg-emerald-500 text-white font-semibold px-2 py-0.5 rounded-full">3連複6点</span>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 実行ボタン ＆ ステータス -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center text-xs">
        <span class="font-semibold text-gray-400">運用ステータス</span>
        <span class="font-bold text-indigo-900 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">0.61 &le; 確信度 &le; 0.76</span>
      </div>
      <button onclick="runTodayPrediction()" id="execBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-sm py-3 px-4 rounded-xl shadow-md transition transform active:scale-95 flex justify-center items-center gap-2">
        <span>&#128640;</span>
        <span>本日の出馬表を取得してAI予測を実行</span>
      </button>
    </div>

    <!-- タブ切り替え（本日予測 / 過去予測） -->
    <div class="flex border-b border-gray-200 bg-white rounded-t-xl overflow-hidden shadow-sm">
      <button id="tabToday" onclick="switchTab('today')" class="w-1/2 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition">
        &#128197; 本日の予想
      </button>
      <button id="tabHistory" onclick="switchTab('history')" class="w-1/2 py-3 text-xs font-bold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition">
        &#128214; 過去の予想 (実績)
      </button>
    </div>

    <!-- 件数サマリー -->
    <div id="summaryBar" class="hidden bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex justify-between items-center text-xs text-emerald-800 font-bold">
      <span id="summaryTitle">★ 対象レース</span>
      <span id="matchCount" class="text-base text-emerald-600 font-black">0 件</span>
    </div>

    <!-- カード表示エリア -->
    <div id="resultsContainer" class="space-y-3">
      <div class="bg-white p-6 rounded-xl border border-dashed border-gray-300 text-center text-xs text-gray-400">
        データを読み込み中...
      </div>
    </div>

  </main>

  <script>
    let currentTab = 'today';
    let allData = { today: [], history: [] };

    window.addEventListener('DOMContentLoaded', fetchResults);

    // RACE ID (例: 202405010602) から YY/MM/DD 開催場R を安全生成する関数
    function formatRaceTitle(item) {
      if (item.formatted_date && item.formatted_date.includes('R')) {
        return item.formatted_date;
      }
      const s = String(item.race_id);
      if (s.length >= 12) {
        const yy = s.substring(2, 4);
        const mm = s.substring(4, 6);
        const dd = s.substring(6, 8);
        const venueCode = s.substring(8, 10);
        const raceNum = parseInt(s.substring(10, 12), 10);
        
        const venueMap = {'01':'札幌', '02':'函館', '03':'福島', '04':'新潟', '05':'東京', '06':'中山', '07':'中京', '08':'京都', '09':'阪神', '10':'小倉'};
        const venueName = venueMap[venueCode] || '競馬場';
        return `${yy}/${mm}/${dd} ${venueName}${raceNum}R`;
      }
      return item.race_id;
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabToday = document.getElementById('tabToday');
      const tabHistory = document.getElementById('tabHistory');

      if (tab === 'today') {
        tabToday.className = "w-1/2 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition";
        tabHistory.className = "w-1/2 py-3 text-xs font-bold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition";
      } else {
        tabHistory.className = "w-1/2 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 transition";
        tabToday.className = "w-1/2 py-3 text-xs font-bold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition";
      }
      renderCards(allData[currentTab] || []);
    }

    function runTodayPrediction() {
      const btn = document.getElementById('execBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      btn.innerHTML = '<span>&#9203;</span><span>最新データを解析中...</span>';
      
      setTimeout(() => { checkLoop(); }, 3000);
    }

    function checkLoop() {
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        fetchResults((success) => {
          if (success || attempts > 15) {
            clearInterval(interval);
            resetBtn();
          }
        });
      }, 3000);
    }

    function resetBtn() {
      const btn = document.getElementById('execBtn');
      btn.disabled = false;
      btn.classList.remove('opacity-50', 'cursor-not-allowed');
      btn.innerHTML = '<span>&#128640;</span><span>本日の出馬表を取得してAI予測を実行</span>';
    }

    function fetchResults(callback) {
      fetch(`today_betting_orders.json?t=${new Date().getTime()}`)
        .then(res => res.json())
        .then(data => {
          const now = new Date();
          const yy = String(now.getFullYear()).slice(2);
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const dd = String(now.getDate()).padStart(2, '0');
          const todayStr = `${yy}/${mm}/${dd}`;

          // 全データに表示タイトル（YY/MM/DD 開催R）を付与
          data.forEach(item => {
            item.titleDisplay = formatRaceTitle(item);
          });

          // 本日と過去データに振分け
          allData.today = data.filter(item => item.race_date === todayStr);
          allData.history = data.filter(item => item.race_date !== todayStr);

          // 【最新日付・最新レース順（降順）にソート】
          allData.today.sort((a, b) => String(b.race_id).localeCompare(String(a.race_id)));
          allData.history.sort((a, b) => String(b.race_id).localeCompare(String(a.race_id)));

          // 本日データが空の場合は自動で過去実績を表示
          if (allData.today.length === 0 && allData.history.length > 0) {
            switchTab('history');
          } else {
            renderCards(allData[currentTab]);
          }
          if (callback) callback(true);
        })
        .catch(() => {
          if (callback) callback(false);
        });
    }

    function renderCards(data) {
      const container = document.getElementById('resultsContainer');
      const summaryBar = document.getElementById('summaryBar');
      const matchCount = document.getElementById('matchCount');
      const summaryTitle = document.getElementById('summaryTitle');

      container.innerHTML = '';
      summaryTitle.textContent = currentTab === 'today' ? '★ 本日の勝負対象' : '★ 過去の選定レース実績';

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-xl border border-gray-200 text-center text-xs text-gray-500">
            ${currentTab === 'today' ? '本日の勝負対象レースはありません（全件見送り）。' : '過去の選定データはありません。'}
          </div>`;
        summaryBar.classList.add('hidden');
        return;
      }

      summaryBar.classList.remove('hidden');
      matchCount.textContent = `${data.length} 件`;

      data.forEach(item => {
        const betsHtml = item.bets.map(b => {
          const isHit = item.hit_bet === b;
          const bgClass = isHit ? 'bg-red-500 text-white font-black animate-pulse' : 'bg-indigo-50 text-indigo-900';
          return `<div class="${bgClass} border border-indigo-100 py-1.5 rounded font-mono font-bold text-center text-xs">${b}</div>`;
        }).join('');

        let statusBadge = '<span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">勝負対象</span>';
        if (item.result_status === 'HIT') {
          statusBadge = `<span class="text-xs bg-red-500 text-white font-black px-2 py-0.5 rounded">🎯 的中 (+¥${item.payout})</span>`;
        } else if (item.result_status === 'LOSE') {
          statusBadge = '<span class="text-xs bg-gray-200 text-gray-600 font-bold px-2 py-0.5 rounded">不的中</span>';
        }

        const card = `
          <div class="bg-white rounded-xl p-4 shadow-md border-l-4 border-emerald-500 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
              <div>
                <!-- ★★ ヘッダー表記部分：YY/MM/DD 開催R を大きく強調 ★★ -->
                <span class="text-base font-black text-indigo-950 block tracking-tight">${item.titleDisplay}</span>
                <span class="text-[10px] font-semibold text-gray-400">RACE ID: ${item.race_id}</span>
              </div>
              <div class="text-right">
                ${statusBadge}
                <p class="text-xs text-gray-500 mt-0.5">軸確信度: <span class="font-bold text-emerald-600">${item.axis_proba}</span></p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-amber-50 p-2.5 rounded-lg border border-amber-200">
                <span class="text-amber-800 font-bold block mb-0.5">軸馬 (1位評価)</span>
                <span class="text-base font-black text-amber-900">馬番 【${item.axis_umaban}】</span>
              </div>
              <div class="bg-blue-50 p-2.5 rounded-lg border border-blue-200">
                <span class="text-blue-800 font-bold block mb-0.5">相手 (2-5位評価)</span>
                <span class="text-sm font-bold text-blue-900">馬番 ${item.opponent_umabans.join(', ')}</span>
              </div>
            </div>

            <div>
              <span class="text-xs font-bold text-gray-600 block mb-1">【3連複 軸1頭相手4頭流し (全6点)】</span>
              <div class="grid grid-cols-3 gap-1.5">${betsHtml}</div>
            </div>
          </div>`;
        container.innerHTML += card;
      });
    }
  </script>
</body>
</html>
